[project]
name = "qbittorrent-optimizer"
version = "0.3.4"
description = "Калькулятор оптимальных настроек qBittorrent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=5.2.0",
    "packaging>=23.1",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "psutil>=6.0.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.18.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["optimizer", "ui"]

[tool.pytest.ini_options]
addopts = "--basetemp=.cache/tests/pytest"
cache_dir = ".cache/pytest"

