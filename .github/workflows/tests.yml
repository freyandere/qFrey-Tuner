name: Tests and upstream API contract

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    env:
      UV_CACHE_DIR: .cache/uv
      UV_PROJECT_ENVIRONMENT: .cache/venv
      PYTHONPYCACHEPREFIX: .cache/pycache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --extra dev
      - name: Offline regression tests
        run: uv run --locked --extra dev python -m pytest tests/ -q
      - name: Official tagged API contract
        run: uv run --locked --extra dev python scripts/check_qbittorrent_schema.py
