name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install dependencies
      env:
        UV_CACHE_DIR: .cache/uv
        UV_PROJECT_ENVIRONMENT: .cache/venv
        PYTHONPYCACHEPREFIX: .cache/pycache
      run: uv sync --locked --extra dev

    - name: Run tests
      env:
        UV_PROJECT_ENVIRONMENT: .cache/venv
        PYTHONPYCACHEPREFIX: .cache/pycache
      run: uv run --extra dev python -m pytest tests/ -v

    - name: Check official API contract
      env:
        UV_PROJECT_ENVIRONMENT: .cache/venv
        PYTHONPYCACHEPREFIX: .cache/pycache
      run: uv run --locked --extra dev python scripts/check_qbittorrent_schema.py

    - name: Build with PyInstaller
      env:
        UV_PROJECT_ENVIRONMENT: .cache/venv
        PYTHONPYCACHEPREFIX: .cache/pycache
      run: |
        uv run --locked --extra dev python scripts/build.py

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/release/qFrey-Tuner.exe
          artifacts/release/build.json
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
